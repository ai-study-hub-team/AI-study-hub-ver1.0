server:
  port: 8080

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      access-token-expiration: 7200000
      refresh-token-expiration: 604800000

resend:
  api-key: ${RESEND_API_KEY}
  from-email: "AI Study Hub <noreply@aistudyhub.com>"
  frontend-url: http://localhost:5173

email-verification:
  token-expiration-minutes: 30
  resend-cooldown-seconds: 60

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:}

spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5433/aistudyhub_pgvector_test
    username: postgres
    password: 123456

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ── File upload limits ───────────────────────────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB      # Maximum size per uploaded file
      max-request-size: 500MB   # Maximum total request size

# ── Custom app settings ────────────────────────────────────────────────────────
app:
  upload:
    dir: uploads   # Files will be saved to a folder named "uploads" in the project root
# ── Frontend URL (used to build share links returned to User A) ──────────────
  frontend:
    base-url: http://localhost:5173

ai:
  service:
    base-url: http://localhost:8000

# ── Vector store configuration ─────────────────────────────────────────────────
# Options: "pgvector" or "pinecone"
# When "pgvector", semantic search queries pgvector directly from Spring Boot.
# When "pinecone", semantic search goes through Python AI service (legacy).
vector:
  store: pgvector

payment:
  vnpay:
    tmn-code: "T4HAJOXL"
    hash-secret: "PK3LLYU09798QYZBW0Y3GCQPEQZ7HVZD"
    pay-url: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html"
    return-url: "http://localhost:8080/api/payments/vnpay-return"
    api-url: "https://sandbox.vnpayment.vn/merchant_webapi/api/transaction"
