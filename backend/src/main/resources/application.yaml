server:
  port: 8080

spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/aistudyhub_pg_test
    username: postgres
    password: 123456

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ── File upload limits ───────────────────────────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB      # Maximum size per uploaded file
      max-request-size: 500MB   # Maximum total request size

# ── Custom app settings ────────────────────────────────────────────────────────
app:
  upload:
    dir: uploads   # Files will be saved to a folder named "uploads" in the project root

ai:
  service:
    base-url: http://localhost:8000

# ── Vector store configuration ─────────────────────────────────────────────────
# Options: "pgvector" or "pinecone"
# When "pgvector", semantic search queries pgvector directly from Spring Boot.
# When "pinecone", semantic search goes through Python AI service (legacy).
vector:
  store: pgvector

# ── pgvector datasource (separate from main datasource) ───────────────────────
pgvector:
  datasource:
    url: jdbc:postgresql://localhost:5433/aistudyhub_pgvector_test
    username: postgres
    password: 123456