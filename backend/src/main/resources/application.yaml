server:
  port: ${PORT:8080}

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      access-token-expiration: 7200000
      refresh-token-expiration: 604800000

resend:
  api-key: ${RESEND_API_KEY}
  from-email: "AI Study Hub <onboarding@resend.dev>"
  frontend-url: ${FRONTEND_BASE_URL:http://localhost:5173}

email-verification:
  token-expiration-minutes: 1440
  resend-cooldown-seconds: 60

password-reset:
  token-expiration-minutes: 15
  resend-cooldown-seconds: 60

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:}
    
spring:
  application:
    name: backend

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
  # ── File upload limits ───────────────────────────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB      # Maximum size per uploaded file
      max-request-size: 500MB   # Maximum total request size

# ── Custom app settings ────────────────────────────────────────────────────────
app:
  upload:
    dir: uploads   # Files will be saved to a folder named "uploads" in the project root
# ── Frontend URL (used to build share links returned to User A) ──────────────
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

ai:
  service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}

# ── Vector store configuration ─────────────────────────────────────────────────
# Options: "pgvector" or "pinecone"
# When "pgvector", semantic search queries pgvector directly from Spring Boot.
# When "pinecone", semantic search goes through Python AI service (legacy).
vector:
  store: pgvector

payment:
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE}
    hash-secret: ${VNPAY_HASH_SECRET}

    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}

    return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/payments/vnpay-return}

    api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
