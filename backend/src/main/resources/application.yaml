server:
  port: 8080

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      access-token-expiration: 900000
      refresh-token-expiration: 604800000

resend:
  api-key: ${RESEND_API_KEY}
  from-email: "AI Study Hub <noreply@aistudyhub.com>"
  frontend-url: http://localhost:5173

spring:
  application:
    name: backend

  datasource:
    url: jdbc:mysql://localhost:3306/ai_study_hub_test?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: root
    password: 123456

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ── File upload limits ───────────────────────────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB      # Maximum size per uploaded file
      max-request-size: 500MB   # Maximum total request size

# ── Custom app settings ────────────────────────────────────────────────────────
app:
  upload:
    dir: uploads   # Files will be saved to a folder named "uploads" in the project root

ai:
  service:
    base-url: http://localhost:8000